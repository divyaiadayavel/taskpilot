name: taskpilot
description: "A TaskPilot Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.0.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Unique ID Generator
  uuid: ^4.3.3

  # Utilities
  url_launcher: ^6.3.0
  file_picker: ^11.0.2
  mailer: ^6.0.1
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
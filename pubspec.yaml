name: taskpilot
description: "A TaskPilot Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

# 📦 DEPENDENCIES
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 STATE MANAGEMENT
  provider: ^6.0.5

  mailer: ^6.0.1

  # 💾 LOCAL DATABASE
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 🆔 UNIQUE ID GENERATOR
  uuid: ^4.3.3

# 🛠 DEV DEPENDENCIES
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 🔄 CODE GENERATION (HIVE)
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

# 🎨 FLUTTER CONFIG
flutter:
  uses-material-design: true

  # 📁 ASSETS (we’ll use later)
  assets:
    - assets/images/